name: formal

on:
  workflow_dispatch:
  push:
    paths:
      - "formal/**"
      - "lean-toolchain"
      - "lakefile.toml"
      - "scripts/build_formal.sh"
      - "scripts/bootstrap.sh"
      - ".github/workflows/formal.yml"

permissions:
  contents: read

jobs:
  lean-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build pinned reproduction image
        run: docker build -f containers/Dockerfile -t twins-formal .
      - name: Build Lean and audit axioms
        run: docker run --name twins-formal-run twins-formal bash -lc './scripts/bootstrap.sh && ./scripts/build_formal.sh'
      - name: Extract logs
        if: always()
        run: |
          mkdir -p ci-formal
          docker cp twins-formal-run:/artifact/build_logs/. ci-formal/ || true
          cp formal/lean/AXIOM_REPORT.md ci-formal/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lean-kernel-evidence
          path: ci-formal/
