name: research-evidence

on:
  workflow_dispatch:
  push:
    paths:
      - "src/python/twins_scheduler/refinement_synthesis.py"
      - "src/python/twins_scheduler/repair_frontier.py"
      - "src/python/twins_scheduler/transition*.py"
      - "src/python/twins_scheduler/coupled_protocol.py"
      - "src/python/twins_scheduler/concrete_trace.py"
      - "scripts/run_refinement_synthesis.py"
      - "scripts/check_synthesis_order_oracle.py"
      - "scripts/run_transition*.py"
      - "scripts/check_transition*.py"
      - "scripts/run_native_conformance.sh"
      - "src/python/twins_scheduler/scaled_protocol.py"
      - "scripts/run_scaled_study.py"
      - "results/scaled/**"
      - "experiments/native_cometbft/**"
      - "results/synthesis/**"
      - "results/native/**"
      - "results/transition/**"
      - "results/transition_bridge/**"
      - "Makefile"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/research.yml"

permissions:
  contents: read

jobs:
  synthesis-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set isolated output paths on the runner
        run: |
          echo "TWINS_OUTPUT_ROOT=$RUNNER_TEMP/research-output" >> "$GITHUB_ENV"
          echo "TWINS_LOG_DIR=$RUNNER_TEMP/research-output/build_logs" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.25.0"
          cache: false
      - name: Install pinned audit dependencies
        run: |
          python -m pip install uv==0.6.14
          uv sync --frozen --extra native-audit
      - name: Recompute synthesis oracles and certificates
        run: make synthesis
      - name: Recompute general transition synthesis and certified abstraction
        run: make transition
      - name: Recompute seven-validator dependent controls and all certificates
        run: make scaled
      - name: Execute unchanged native code, audit signatures, repeat with race detector
        run: make native
      - name: Compare deterministic evidence
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          output = Path(os.environ["TWINS_OUTPUT_ROOT"])
          files = sorted(Path("results/synthesis").rglob("*"))
          files.extend(sorted(Path("results/transition").rglob("*")))
          files.extend(sorted(Path("results/transition_bridge").rglob("*")))
          files.extend(sorted(Path("results/scaled").rglob("*")))
          files.append(Path("results/native/native_summary.json"))
          for reference in files:
              if reference.is_file():
                  assert reference.read_bytes() == (output / reference).read_bytes(), reference
          print("STRUCTURAL, TRANSITION, ABSTRACTION AND NATIVE SEMANTIC REFERENCES: PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthesis-native-evidence
          path: ${{ runner.temp }}/research-output/
