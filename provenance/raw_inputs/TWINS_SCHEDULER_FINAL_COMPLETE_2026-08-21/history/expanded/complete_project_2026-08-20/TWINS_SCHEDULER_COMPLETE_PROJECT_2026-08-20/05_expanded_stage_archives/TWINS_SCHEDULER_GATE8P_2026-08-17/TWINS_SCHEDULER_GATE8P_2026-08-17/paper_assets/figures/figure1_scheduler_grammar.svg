<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="380" viewBox="0 0 1020 380">
<title>Scheduler grammar embeddings</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#111}.b{fill:#f5f5f5;stroke:#222;stroke-width:1.5}.ar{stroke:#222;stroke-width:1.6;fill:none;marker-end:url(#a)}.d{stroke:#555;stroke-width:1.3;stroke-dasharray:6 5;fill:none}.h{font-size:19px;font-weight:700}.s{font-size:13px}.m{font-size:15px}.k{font-size:14px;font-weight:700}</style>
<text x="510" y="30" text-anchor="middle" class="h">Scheduler grammar embeddings</text>
<rect x="20" y="75" width="180" height="78" rx="8" class="b"/>
<text x="110.0" y="100" text-anchor="middle" class="k">G_P</text>
<text x="110.0" y="124" text-anchor="middle" class="s">partition</text>
<text x="110.0" y="141" text-anchor="middle" class="s">per view</text>
<rect x="220" y="75" width="180" height="78" rx="8" class="b"/>
<text x="310.0" y="100" text-anchor="middle" class="k">G_D</text>
<text x="310.0" y="124" text-anchor="middle" class="s">directed graph</text>
<text x="310.0" y="141" text-anchor="middle" class="s">per view; type-uniform</text>
<rect x="420" y="75" width="180" height="78" rx="8" class="b"/>
<text x="510.0" y="100" text-anchor="middle" class="k">G_T</text>
<text x="510.0" y="124" text-anchor="middle" class="s">phase/type-specific</text>
<text x="510.0" y="141" text-anchor="middle" class="s">directed graph</text>
<rect x="620" y="75" width="180" height="78" rx="8" class="b"/>
<text x="710.0" y="100" text-anchor="middle" class="k">G_M</text>
<text x="710.0" y="124" text-anchor="middle" class="s">per-message</text>
<text x="710.0" y="141" text-anchor="middle" class="s">instance control</text>
<rect x="820" y="75" width="180" height="78" rx="8" class="b"/>
<text x="910.0" y="100" text-anchor="middle" class="k">G_R</text>
<text x="910.0" y="124" text-anchor="middle" class="s">per-message</text>
<text x="910.0" y="141" text-anchor="middle" class="s">plus replay</text>
<rect x="420" y="235" width="180" height="78" rx="8" class="b"/>
<text x="510.0" y="260" text-anchor="middle" class="k">G_D1</text>
<text x="510.0" y="284" text-anchor="middle" class="s">directed graph plus</text>
<text x="510.0" y="301" text-anchor="middle" class="s">one-view terminal delay</text>
<line x1="200" y1="114.0" x2="220" y2="114.0" class="ar"/>
<line x1="400" y1="114.0" x2="420" y2="114.0" class="ar"/>
<line x1="600" y1="114.0" x2="620" y2="114.0" class="ar"/>
<line x1="800" y1="114.0" x2="820" y2="114.0" class="ar"/>
<path d="M310.0,153 C310.0,190 510.0,190 510.0,235" class="ar"/>
<path d="M510,235 C560,205 560,180 510,153" class="d"/>
<text x="585" y="205" class="s">incomparable dimensions</text>
<text x="510" y="350" text-anchor="middle" class="m">G_D1 and G_T are intentionally incomparable dimensions in the studied model.</text>
</svg>
