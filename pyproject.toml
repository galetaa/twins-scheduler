[project]
name = "twins-scheduler-closure"
version = "1.0.0"
description = "Reproducible bounded scheduler-grammar closure artifact"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = []

[dependency-groups]
dev = ["pytest==8.3.5"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python/twins_scheduler"]

[tool.pytest.ini_options]
pythonpath = ["src/python"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.uv]
package = true

