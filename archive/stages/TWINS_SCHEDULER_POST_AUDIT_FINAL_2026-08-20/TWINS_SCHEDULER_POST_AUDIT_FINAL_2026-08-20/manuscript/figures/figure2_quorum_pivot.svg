<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<title>Parametric quorum pivot separation</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#111}.b{fill:#f5f5f5;stroke:#222;stroke-width:1.5}.ar{stroke:#222;stroke-width:1.6;fill:none;marker-end:url(#a)}.d{stroke:#555;stroke-width:1.3;stroke-dasharray:6 5;fill:none}.h{font-size:19px;font-weight:700}.s{font-size:13px}.m{font-size:15px}.k{font-size:14px;font-weight:700}</style>
<text x="500" y="32" text-anchor="middle" class="h">Quorum-pivot separation: n=3f+1, q=2f+1</text>
<rect x="45" y="65" width="160" height="65" rx="9" class="b"/>
<text x="125" y="92" text-anchor="middle" class="k">B</text>
<text x="125" y="115" text-anchor="middle" class="s">f Byzantine</text>
<rect x="235" y="65" width="160" height="65" rx="9" class="b"/>
<text x="315" y="92" text-anchor="middle" class="k">A</text>
<text x="315" y="115" text-anchor="middle" class="s">f honest</text>
<rect x="425" y="65" width="160" height="65" rx="9" class="b"/>
<text x="505" y="92" text-anchor="middle" class="k">p</text>
<text x="505" y="115" text-anchor="middle" class="s">one honest pivot</text>
<rect x="615" y="65" width="160" height="65" rx="9" class="b"/>
<text x="695" y="92" text-anchor="middle" class="k">C</text>
<text x="695" y="115" text-anchor="middle" class="s">f honest</text>
<rect x="45" y="150" width="540" height="40" rx="6" class="b"/><text x="315" y="176" text-anchor="middle" class="m">Q₀ = B ∪ A ∪ {p}, size 2f+1</text>
<rect x="425" y="205" width="350" height="40" rx="6" class="b"/><text x="600" y="231" text-anchor="middle" class="m">Q₁ = B ∪ C ∪ {p}, size 2f+1</text>
<text x="810" y="95" class="s">Q₀ ∩ Q₁ = B ∪ {p}</text>
<text x="810" y="117" class="s">unique honest overlap: p</text>
<text x="500" y="285" text-anchor="middle" class="h">One sender→p edge carries enabling E, then repair R</text>
<rect x="30" y="315" width="290" height="175" rx="10" class="b"/>
<text x="175" y="345" text-anchor="middle" class="k">G_T: E yes, R no</text>
<text x="175" y="385" text-anchor="middle" class="m">p serves both branches</text>
<text x="175" y="450" text-anchor="middle" class="s">Q₀=q and Q₁=q → unsafe</text>
<rect x="355" y="315" width="290" height="175" rx="10" class="b"/>
<text x="500" y="345" text-anchor="middle" class="k">G_D: edge off</text>
<text x="500" y="385" text-anchor="middle" class="m">neither E nor R</text>
<text x="500" y="450" text-anchor="middle" class="s">first support=2f=q−1 → safe</text>
<rect x="680" y="315" width="290" height="175" rx="10" class="b"/>
<text x="825" y="345" text-anchor="middle" class="k">G_D: edge on</text>
<text x="825" y="385" text-anchor="middle" class="m">both E and R</text>
<text x="825" y="450" text-anchor="middle" class="s">repair removes p; Q₁=2f → safe</text>
<text x="500" y="535" text-anchor="middle" class="m">Existential result for the explicit schema; no universal incompleteness claim.</text>
</svg>
