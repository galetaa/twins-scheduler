<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
<title>Exact premise characterization</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#111}.b{fill:#f5f5f5;stroke:#222;stroke-width:1.5}.ar{stroke:#222;stroke-width:1.6;fill:none;marker-end:url(#a)}.d{stroke:#555;stroke-width:1.3;stroke-dasharray:6 5;fill:none}.h{font-size:19px;font-weight:700}.s{font-size:13px}.m{font-size:15px}.k{font-size:14px;font-weight:700}</style>
<text x="490" y="32" text-anchor="middle" class="h">Exact seven-flag characterization</text>
<text x="160" y="105" text-anchor="middle" style="font-size:42px;font-weight:700">128</text>
<text x="160" y="135" text-anchor="middle" class="m">assignments</text>
<text x="490" y="105" text-anchor="middle" style="font-size:42px;font-weight:700">3</text>
<text x="490" y="135" text-anchor="middle" class="m">strict assignments</text>
<text x="820" y="105" text-anchor="middle" style="font-size:42px;font-weight:700">0</text>
<text x="820" y="135" text-anchor="middle" class="m">mismatches</text>
<rect x="70" y="170" width="840" height="65" rx="9" class="b"/>
<text x="490" y="200" text-anchor="middle" class="k">Strict = S₂ ∧ D ∧ T ∧ E ∧ X ∧ (S₁ ∨ Rq)</text>
<text x="490" y="222" text-anchor="middle" class="s">patterns: 0111111, 1101111, 1111111</text>
<rect x="55" y="270" width="270" height="38" rx="6" class="b"/>
<text x="190" y="294" text-anchor="middle" class="s">S₂: second base short by one</text>
<rect x="360" y="270" width="270" height="38" rx="6" class="b"/>
<text x="495" y="294" text-anchor="middle" class="s">D: repair disables pivot</text>
<rect x="665" y="270" width="270" height="38" rx="6" class="b"/>
<text x="800" y="294" text-anchor="middle" class="s">T: repair precedes second chance</text>
<rect x="55" y="324" width="270" height="38" rx="6" class="b"/>
<text x="190" y="348" text-anchor="middle" class="s">E: messages share endpoint edge</text>
<rect x="360" y="324" width="270" height="38" rx="6" class="b"/>
<text x="495" y="348" text-anchor="middle" class="s">X: grammar can split E and R</text>
<text x="490" y="398" text-anchor="middle" class="m">S₁ and Rq are individually optional, but at least one is required.</text>
</svg>
